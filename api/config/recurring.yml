# Solid Queue recurring tasks (replaces the old sidekiq-cron schedule).
# Loaded by the dispatcher.
#
# Timezone: the two daily tasks name Asia/Tokyo in the cron string, because a
# wall-clock promise to a Tokyo user has to survive the container running UTC.
# The two hourly ones are deliberately zone-less. Since solid_queue 1.5.0 a
# zone-less schedule resolves in config.time_zone ("Tokyo") rather than the
# system zone (UTC in the container) -- for an hourly-at-minute-N schedule those are
# the same set of instants, because JST is a whole-hour offset, so the 1.5.0
# change is a no-op here. Anything added below that is daily, or that runs in a
# half-hour zone, does NOT get that reprieve: give it an explicit zone.

production:
  # Daily follow-up reminders at 08:15 JST (was "15 23 * * *" UTC under
  # sidekiq-cron — same wall-clock time for Tokyo users).
  follow_up_reminders:
    class: FollowUpReminderJob
    schedule: "15 8 * * * Asia/Tokyo"

  # Push reminders for upcoming interviews and residence-expiry thresholds
  # (v1.10.0). 08:00 JST, just before the follow-up digest, so a morning brings
  # one wave of notifications rather than two spread out.
  interview_reminders:
    class: InterviewReminderJob
    schedule: "0 8 * * * Asia/Tokyo"

  # Keep the jobs table from growing unbounded (single-DB setup — these rows
  # live in the primary Postgres).
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Wipe the shared "Try demo" account back to a clean seed each hour so it
  # doesn't accumulate every visitor's edits. Scoped to the demo user only.
  reset_demo_account:
    class: DemoResetJob
    schedule: every hour at minute 42
