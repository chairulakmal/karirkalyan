name: web-ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: web

jobs:
  # See api.yml for why this exists: a skipped required check blocks the push,
  # so path filtering happens here rather than on the workflow trigger.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        working-directory: .
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only \
              "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}")
          else
            before="${{ github.event.before }}"
            # First push to a branch, or a force-push: no reliable base. Run everything.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "api=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            files=$(git diff --name-only "$before" "${{ github.sha }}")
          fi

          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # Two questions, because the two jobs below have different appetites.
          #
          # `code` drives lint/typecheck/build, which cannot see the backend, so
          # it ignores api/ the way api.yml ignores web/. Stated as an exclusion
          # list rather than as `^web/`, so an unrecognised root path still runs.
          # llms.txt stays on that list despite living under web/: CLAUDE.md
          # counts it as documentation and it ships as a static asset, so a
          # rebuild would buy nothing.
          #
          # `api` drives the E2E job, and there the favour is not returned: that
          # job boots the real Rails API and is the only thing in this repo that
          # tests the two halves against each other, so a backend-only change is
          # precisely what it exists to catch.
          relevant=$(printf '%s\n' "$files" \
            | grep -vE '(\.md$|^LICENSE$|^notes/|^api/|^web/public/llms\.txt$)' || true)
          api_changed=$(printf '%s\n' "$files" | grep -E '^api/' || true)

          if [ -n "$relevant" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$api_changed" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Next lint, typecheck & build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Build-time placeholder; real value comes from docker-compose.prod.yml
      # in production (the api container's internal service name and port).
      API_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Ahead of the build, because a missing ja key builds clean — the whole point.
      - name: i18n catalog parity
        run: npm run lint:i18n

      # Proves the "no hardcoded FSM sets" claim rather than asserting it in prose
      # (a grep that had been wrong twice). Legit affordance sets carry a marker.
      - name: FSM copies
        run: npm run lint:fsm

      - name: TypeScript
        run: npx tsc --noEmit

      # Pure-TS unit tests (vitest), no DB and no browser: the seam the
      # timezone/triage logic needs. Playwright e2e stays its own push-only job.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: [changes, verify]
    # `always()`, because a backend-only change skips `verify` and would take this
    # job down with it through `needs`: the one job that would have caught the
    # contract break, skipped for touching only the backend. The result guards put
    # the ordering back, so a red or cancelled `verify` still short-circuits it.
    if: >-
      always()
      && github.event_name == 'push'
      && needs.changes.result == 'success'
      && needs.verify.result != 'failure'
      && needs.verify.result != 'cancelled'
      && (needs.changes.outputs.code == 'true' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: karirkalyan
          POSTGRES_PASSWORD: karirkalyan
          POSTGRES_DB: api_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karirkalyan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: development
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: karirkalyan
      DB_PASSWORD: karirkalyan
      DATABASE_URL: postgresql://karirkalyan:karirkalyan@localhost:5432/api_development
      DEVISE_JWT_SECRET_KEY: ci-only-not-a-real-secret
      API_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Prepare database
        # db:seed is not optional here: the E2E suite signs in as the `e2e`
        # account rather than registering one (SPEC.md § Registration is closed),
        # and seeds.rb is where that account comes from. Seeding is idempotent.
        run: bin/rails db:create db:migrate db:seed
        working-directory: api

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  # The branch ruleset requires this exact context name. It must always run and
  # always report, so it is `if: always()` and never path-filtered.
  gate:
    name: Lint, typecheck & build
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        working-directory: .
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          verify="${{ needs.verify.result }}"
          echo "changes=$changes verify=$verify"

          if [ "$changes" != "success" ]; then
            echo "::error::Change detection failed; refusing to report green."
            exit 1
          fi

          case "$verify" in
            success) echo "Web checks passed." ;;
            skipped) echo "Nothing under web/ changed; web checks not required." ;;
            *)       echo "::error::Web checks did not pass (result: $verify)."; exit 1 ;;
          esac
